apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: video-ai-api-hpa
  namespace: video-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video-ai-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # CPU metric
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory metric
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: video-ai-celery-video-hpa
  namespace: video-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video-ai-celery-video
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: video-ai-celery-ai-hpa
  namespace: video-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video-ai-celery-ai
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
