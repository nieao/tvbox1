apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-ai-api
  namespace: video-ai
  labels:
    app: video-ai
    component: api
  annotations:
    description: "Video-AI API Service"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: video-ai
      component: api
  template:
    metadata:
      labels:
        app: video-ai
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: video-ai-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Pod affinity - spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - video-ai
                topologyKey: kubernetes.io/hostname

      # Init containers
      initContainers:
        - name: db-migrate
          image: video-ai:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

      # Main container
      containers:
        - name: api
          image: video-ai:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 8001
              protocol: TCP

          # Environment variables
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-key
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: google-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis-url
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: mongodb-uri

          # Resource limits
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

          # Probes
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          # Volume mounts
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: temp
              mountPath: /tmp

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

      # Volumes
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: video-ai-data-pvc
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}

---

# Celery Worker - Video Processing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-ai-celery-video
  namespace: video-ai
  labels:
    app: video-ai
    component: celery-worker
    queue: video
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-ai
      component: celery-worker
      queue: video
  template:
    metadata:
      labels:
        app: video-ai
        component: celery-worker
        queue: video
    spec:
      serviceAccountName: video-ai-celery
      containers:
        - name: celery-worker
          image: video-ai:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - src.tasks.celery_app
            - worker
            - --loglevel=info
            - --queues=video
            - --concurrency=2
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis-url
          resources:
            requests:
              memory: "3Gi"
              cpu: "1500m"
            limits:
              memory: "6Gi"
              cpu: "3000m"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: video-ai-data-pvc
        - name: logs
          emptyDir: {}

---

# Celery Worker - AI Processing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-ai-celery-ai
  namespace: video-ai
  labels:
    app: video-ai
    component: celery-worker
    queue: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-ai
      component: celery-worker
      queue: ai
  template:
    metadata:
      labels:
        app: video-ai
        component: celery-worker
        queue: ai
    spec:
      serviceAccountName: video-ai-celery
      containers:
        - name: celery-worker
          image: video-ai:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - src.tasks.celery_app
            - worker
            - --loglevel=info
            - --queues=ai
            - --concurrency=1
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: openai-key
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: google-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: redis-url
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: models
              mountPath: /app/models
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: video-ai-data-pvc
        - name: logs
          emptyDir: {}
        - name: models
          emptyDir: {}
